# A pushed tag "release-YYYY-MM-DD" makes a GitHub release with one zip per
# addon (<Addon>-<version>.zip), addons.json, update.ps1 and update.cmd, and
# the CHANGELOG.md as notes. update.cmd reads the latest release, so pushing
# the tag publishes to every friend: it needs Jiahua's OK.
name: release
on:
  push:
    tags: ["release-*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - run: lua5.1 tests/lootvalue.lua && lua5.1 tests/omni.lua
      - run: python3 -m unittest tests/test_release.py
      - run: python3 tools/release.py check --tag "$GITHUB_REF_NAME"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd logs/wow-addons
          gh release create "$GITHUB_REF_NAME" *.zip addons.json update.ps1 update.cmd \
            --title "$GITHUB_REF_NAME" --notes-file ../../CHANGELOG.md
