name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - run: lua5.1 tests/lootvalue.lua
      - run: lua5.1 tests/omni.lua
      - run: lua5.1 tests/upgradefinder.lua
      - run: lua5.1 tests/glance.lua
      - run: python3 -m unittest tests/test_release.py
  updater:
    # update.ps1 in Windows PowerShell 5.1, against a local test build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: python tools/release.py build
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $client = Join-Path $env:RUNNER_TEMP '_forever_'
          New-Item -ItemType Directory -Force (Join-Path $client 'Interface\AddOns\Auctionator') | Out-Null
          Set-Content (Join-Path $client 'Interface\AddOns\Auctionator\Auctionator.toc') '## Title: stub'
          $manifest = 'logs\wow-addons\addons.json'
          powershell -NoProfile -ExecutionPolicy Bypass -File update.ps1 -Client $client -Manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw "first run failed" }
          foreach ($a in 'LootValue', 'Omni') {
            if (-not (Test-Path (Join-Path $client "Interface\AddOns\$a\$a.toc"))) { throw "$a not installed" }
          }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File update.ps1 -Client $client -Manifest $manifest | Out-String
          Write-Host $out
          if ($out -notmatch 'LootValue 0\.1\.0: up to date' -or $out -notmatch 'Omni 0\.1\.0: up to date') { throw "second run reinstalled" }
          # The live manifest from the latest GitHub release (served as
          # application/octet-stream): -Check reads it and changes nothing.
          $live = Join-Path $env:RUNNER_TEMP 'live\_forever_'
          New-Item -ItemType Directory -Force (Join-Path $live 'Interface\AddOns') | Out-Null
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File update.ps1 -Client $live -Check | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'UpgradeFinder [0-9.]+: would install') { throw "live manifest not read" }
          # An update that stopped between its two moves: the old folder is put back.
          $stage = Join-Path $client 'wow-addons-staging-test'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Move-Item (Join-Path $client 'Interface\AddOns\Omni') (Join-Path $stage 'Omni.old')
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File update.ps1 -Client $client -Manifest $manifest | Out-String
          Write-Host $out
          if ($out -notmatch 'Put back Omni') { throw "orphan not put back" }
          if (Test-Path $stage) { throw "staging folder left behind" }
          if (-not (Test-Path (Join-Path $client 'Interface\AddOns\Omni\Omni.toc'))) { throw "Omni missing" }
          # A linked addon folder (a developer copy) is never moved or deleted.
          $client2 = Join-Path $env:RUNNER_TEMP 'linked\_forever_'
          $dev = Join-Path $env:RUNNER_TEMP 'dev-LootValue'
          New-Item -ItemType Directory -Force (Join-Path $client2 'Interface\AddOns'), $dev | Out-Null
          Set-Content (Join-Path $dev 'keep.txt') 'mine'
          cmd /c mklink /J (Join-Path $client2 'Interface\AddOns\LootValue') $dev | Out-Null
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File update.ps1 -Client $client2 -Manifest $manifest | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "a dev copy is not a failure" }
          if ($out -notmatch 'LootValue: dev copy') { throw "dev copy not reported" }
          if (-not (Test-Path (Join-Path $dev 'keep.txt'))) { throw "the link target was changed" }
          if (-not (Test-Path (Join-Path $client2 'Interface\AddOns\Omni\Omni.toc'))) { throw "Omni not installed next to the link" }
          # dev.ps1: Omni to this checkout and back.
          $omni = Join-Path $client 'Interface\AddOns\Omni'
          $isLink = { param($p) [bool]((Get-Item -LiteralPath $p -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) }
          powershell -NoProfile -ExecutionPolicy Bypass -File dev.ps1 Omni -Client $client
          if ($LASTEXITCODE -ne 0) { throw "dev.ps1 Omni failed" }
          if (-not (& $isLink $omni)) { throw "Omni is not a link" }
          if (-not (Test-Path (Join-Path $client 'wow-addons-prod\Omni\Omni.toc'))) { throw "release copy not parked" }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File dev.ps1 -Status -Client $client | Out-String
          Write-Host $out
          if ($out -notmatch 'Omni: dev' -or $out -notmatch 'LootValue: release copy') { throw "status wrong" }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File update.ps1 -Client $client -Manifest $manifest | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Omni: dev copy' -or $out -notmatch 'In dev mode \(not updated\): Omni') { throw "update changed or hid the dev copy" }
          if (-not (& $isLink $omni)) { throw "update replaced the dev link" }
          powershell -NoProfile -ExecutionPolicy Bypass -File dev.ps1 -Off -Client $client
          if ($LASTEXITCODE -ne 0) { throw "dev.ps1 -Off failed" }
          if (& $isLink $omni) { throw "Omni still a link" }
          if (-not (Test-Path (Join-Path $omni 'Omni.toc'))) { throw "release copy not back" }
          if (Test-Path (Join-Path $client 'wow-addons-prod\Omni')) { throw "parked copy left behind" }
          if (-not (Test-Path 'Omni\Omni.toc')) { throw "the checkout was changed" }
          exit 0
